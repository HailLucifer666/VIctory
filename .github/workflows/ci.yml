name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Runs tests and the gate in one pass: `test-gate` runs `cargo test`,
      # which includes xtask's repository_passes_policy, the asset-policy
      # check, and then fails on a run that executed nothing (exit 1 if no
      # tests ran).
      - name: Tests, gate
        run: cargo xtask test-gate --workspace --locked
